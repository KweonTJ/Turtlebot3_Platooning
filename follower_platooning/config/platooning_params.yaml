follower_platooning:
  ros__parameters:
    platooning_mode: "odom"

    # Distance control uses the horizontal IMU-to-IMU gap.
    # The current platooning xacro has imu_link at base_link + (0, 0, 0.020).
    target_distance: 0.30
    min_distance: 0.25
    max_distance: 0.40
    emergency_stop_distance: 0.15

    kp_distance: 0.95
    # Odom 추종은 리더를 향해 회전하는 chase 방식이 아니라,
    # 리더 yaw와 평행을 유지하면서 lateral 오차만 부드럽게 줄인다.
    kp_yaw: 0.45
    kp_lateral: 0.35
    # 실제 팔로워가 오른쪽으로 튀는 현상을 막기 위해 lateral 보정 방향을
    # 반전한다. 반대 방향으로 튀면 이 값만 1.0으로 되돌린다.
    lateral_control_sign: -1.0
    ki_yaw: 0.0
    kd_yaw: 0.04
    ki_lateral: 0.0
    kd_lateral: 0.0
    yaw_integral_limit: 0.30
    lateral_integral_limit: 0.20

    max_linear_speed: 0.22
    max_angular_speed: 0.45

    marker_lost_timeout: 0.5
    odom_timeout: 1.0
    leader_search_timeout: 12.0
    leader_search_stop_tolerance: 0.03
    heartbeat_timeout: 1.0
    heartbeat_required: false
    leader_cmd_timeout: 1.0

    enable_reverse: true
    allow_distance_reverse: true
    close_reverse_min_speed: 0.035
    search_last_leader_pose: true
    allow_odom_without_heartbeat: true
    mirror_leader_reverse_turn: true
    use_leader_linear_feedforward: true
    # 직진 추종 중에는 리더 angular feedforward가 순간적인 방향 튐을 만든다.
    # 제자리 회전/후진 mirror 경로는 아래 mirror_leader_reverse_turn 로직을 유지한다.
    use_leader_angular_feedforward: false
    hold_when_leader_stopped: true
    leader_cmd_linear_gain: 1.25
    # Mirror the leader's angular command with the same ROS yaw sign.
    # Odom heading correction still uses kp_yaw below.
    leader_cmd_angular_gain: 0.55
    leader_stopped_linear_threshold: 0.015
    leader_stopped_angular_threshold: 0.04
    leader_cmd_reverse_threshold: 0.01
    leader_cmd_turn_threshold: 0.12
    leader_cmd_turn_linear_deadband: 0.02
    leader_reverse_max_distance_error: 0.08
    distance_deadband: 0.03
    odom_heading_deadband: 0.06
    odom_linear_heading_gate: 0.35
    far_catchup_use_max_speed: true
    far_catchup_heading_gate: 0.90
    far_catchup_angular_feedforward_scale: 0.35
    cmd_angular_deadband: 0.02
    angular_slew_rate: 0.35
    # /leader/odom_aligned is already transformed into the follower odom frame
    # by leader_odom_aligner below. Keep this disabled here to avoid applying
    # the 0.30 m initial leader offset twice, which makes the controller think
    # the follower is already at the target gap and publish zero velocity.
    use_initial_odom_offset: false
    initial_leader_offset_x: 0.30
    initial_leader_offset_y: 0.0
    leader_imu_offset_x: 0.0
    leader_imu_offset_y: 0.0
    follower_imu_offset_x: 0.0
    follower_imu_offset_y: 0.0

    target_visible_topic: "/follower/target_visible"
    target_offset_x_topic: "/follower/target_offset_x"
    target_distance_topic: "/follower/target_distance"

    follower_enable_topic: "/leader/follower_enable"
    platoon_mode_topic: "/leader/platoon_mode"
    heartbeat_topic: "/leader/heartbeat"
    leader_cmd_vel_topic: "/leader/cmd_vel"
    leader_odom_topic: "/leader/odom_aligned"
    follower_odom_topic: "/odom"

    cmd_vel_raw_topic: "/follower/cmd_vel_raw"
    status_topic: "/follower/status"
    distance_error_topic: "/follower/distance_error"

leader_odom_aligner:
  ros__parameters:
    initial_leader_offset_x: 0.30
    initial_leader_offset_y: 0.0
    leader_imu_offset_x: 0.0
    leader_imu_offset_y: 0.0
    follower_imu_offset_x: 0.0
    follower_imu_offset_y: 0.0
    leader_odom_topic: "/leader/odom"
    follower_odom_topic: "/odom"
    aligned_leader_odom_topic: "/leader/odom_aligned"
