follower_safety:
  ros__parameters:
    front_obstacle_distance: 0.12
    side_obstacle_distance: 0.08
    front_angle_deg: 25.0
    use_scan_safety: false

    marker_required: false
    heartbeat_required: true
    allow_fresh_cmd_without_heartbeat: true
    use_distance_safety: true

    heartbeat_timeout: 1.0
    cmd_vel_timeout: 0.5
    distance_timeout: 0.5
    min_distance: 0.25
    emergency_stop_distance: 0.15

    allow_reverse: true
    allow_untracked_reverse_or_turn: true
    untracked_reverse_threshold: 0.01
    untracked_turn_threshold: 0.05
    untracked_turn_linear_deadband: 0.02

    max_linear_speed: 0.22
    max_angular_speed: 0.45

    cmd_vel_raw_topic: "/follower/cmd_vel_raw"
    target_visible_topic: "/follower/target_visible"
    target_distance_topic: "/follower/target_distance"
    heartbeat_topic: "/leader/heartbeat"
    scan_topic: "/scan"

    cmd_vel_topic: "/cmd_vel"
    safety_state_topic: "/follower/safety_state"
